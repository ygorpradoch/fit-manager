<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro - FitManager Mobile</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="screen-content" style="padding-top:40px;">
      <a href="login.html" class="link" style="font-size:20px; font-weight:700;">&larr;</a>
      <h1 style="text-align:center; font-size:22px; margin:16px 0 4px;">Criar Conta</h1>
      <p class="text-muted center" style="margin:0 auto 20px; max-width:260px;">Preencha seus dados para começar a treinar</p>

      <form onsubmit="event.preventDefault(); window.location.href='login.html';">
        <div class="field">
          <label for="nome">Nome Completo</label>
          <input id="nome" type="text" placeholder="Digite seu nome completo" required>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="Digite seu e-mail" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" type="password" placeholder="Crie uma senha (mín. 8 caracteres)" required minlength="8">
        </div>
        <div class="field">
          <label for="confirmar">Confirmar Senha</label>
          <input id="confirmar" type="password" placeholder="Repita a senha" required>
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar</button>
      </form>

      <p class="center" style="margin-top:16px;"><a href="login.html" class="link-muted">Já tem uma conta? Login</a></p>
    </div>
  </div>
</div>
</body>
</html>
