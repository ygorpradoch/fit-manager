<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recuperar Senha - FitManager Mobile</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="screen-content" style="padding-top:80px;">
      <a href="login.html" class="link" style="font-size:20px; font-weight:700;">&larr;</a>
      <h1 style="text-align:center; font-size:22px; margin:16px 0 4px;">Recuperar Senha</h1>
      <p class="text-muted center" style="margin:0 auto 20px; max-width:270px;">Digite o e-mail cadastrado para receber o link de redefinição de senha</p>

      <form onsubmit="event.preventDefault(); alert('Link de recuperação enviado para o e-mail informado.'); window.location.href='login.html';">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="Digite seu e-mail cadastrado" required>
        </div>
        <button type="submit" class="btn btn-primary">Enviar Link</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
